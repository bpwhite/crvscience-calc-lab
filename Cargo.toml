[workspace]
resolver = "2"
members = [
    "crates/calc-core",
    "crates/calc-app",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["CRV Science / CalcLab Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
egui_plot = "0.29"
calc-core = { path = "crates/calc-core" }
